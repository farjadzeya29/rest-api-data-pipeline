services:
  mysql:
    image: mysql:8.0.36
    container_name: ecommerce_dw_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: ecommerce_dw
      MYSQL_USER: etl_runner
      MYSQL_PASSWORD: etl_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "etl_runner", "-petl_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional Adminer / Web GUI to inspect tables at http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: ecommerce_dw_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
